<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculator | OASIS INFOBYTE</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculator">

        <!-- Calculator Header -->
        <div class="calculator-header">
            <h1>Calculator</h1>
            <p>OASIS INFOBYTE - Level 2</p>
        </div>

        <!-- Display Screen -->
        <div class="display">
            <div id="previous-display"></div>
            <div id="current-display">0</div>
        </div>

        <!-- Calculator Buttons -->
        <div class="buttons">

            <!-- First Row -->
            <button class="function" id="clear">C</button>
            <button class="function" id="backspace">⌫</button>
            <button class="operator" data-operator="÷">÷</button>
            <button class="operator" data-operator="×">×</button>

            <!-- Second Row -->
            <button class="number" data-number="7">7</button>
            <button class="number" data-number="8">8</button>
            <button class="number" data-number="9">9</button>
            <button class="operator" data-operator="-">−</button>

            <!-- Third Row -->
            <button class="number" data-number="4">4</button>
            <button class="number" data-number="5">5</button>
            <button class="number" data-number="6">6</button>
            <button class="operator" data-operator="+">+</button>

            <!-- Fourth Row -->
            <button class="number" data-number="1">1</button>
            <button class="number" data-number="2">2</button>
            <button class="number" data-number="3">3</button>
            <button class="equals" id="equals">=</button>

            <!-- Fifth Row -->
            <button class="number zero" data-number="0">0</button>
            <button class="number" data-number=".">.</button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
